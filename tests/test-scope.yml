name: Test Docker Login with Scope
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a local registry for testing
        run: |
          docker run -d -p 5003:5000 --name registry-scope registry:2
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5003/v2/ > /dev/null 2>&1; then
              echo "Registry is ready"
              break
            fi
            echo "Waiting for registry... ($i)"
            sleep 1
          done

      - id: login
        uses: .
        with:
          registry: localhost:5003
          username: testuser
          password: testpassword
          scope: 'buildkit'
          logout: 'false'

      - name: Assert login action completed with scope
        run: |
          echo "Login action completed with scope=buildkit."
          echo "PASS: action ran successfully with scope parameter"

      - name: Cleanup
        if: always()
        run: |
          docker stop registry-scope 2>/dev/null || true
          docker rm registry-scope 2>/dev/null || true
