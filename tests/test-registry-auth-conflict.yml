name: Test registry-auth combined with other inputs fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          registry: ghcr.io
          logout: 'false'
          registry-auth: |
            - registry: ghcr.io
              username: someuser
              password: somepassword
      - name: Assert action failed (Cannot use registry-auth with other inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when registry-auth is combined with registry"
            exit 1
          fi
          echo "PASS"
