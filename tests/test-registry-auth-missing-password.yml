name: Test registry-auth entry without password fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          logout: 'false'
          registry-auth: |
            - registry: ghcr.io
              username: someuser
      - name: Assert action failed (Password required)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when registry-auth entry has no password"
            exit 1
          fi
          echo "PASS"
