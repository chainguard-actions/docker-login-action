name: Test Docker Hub Login
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Docker Hub credentials
        run: |
          # We use a fake token that will fail auth but we can verify the action
          # attempts to log in (the action itself should not error on bad creds
          # in a way that prevents us from checking the attempt was made).
          # For a real integration test we'd need real creds; here we test
          # that the action runs and produces expected behavior with logout=false.
          echo "Credentials set up"
      - id: login
        name: Login to Docker Hub
        uses: .
        with:
          username: fakeuser
          password: fakepassword
          logout: 'false'
        continue-on-error: true
      - name: Assert login was attempted
        env:
          OUTCOME: ${{ steps.login.outcome }}
        run: |
          echo "Login outcome: $OUTCOME"
          # With fake credentials, the action will fail authentication
          # but it should fail with 'failure' not 'skipped' or something unexpected
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure with fake creds)"
