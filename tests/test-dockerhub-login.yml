name: Test Docker Hub login
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test Docker Hub login
        id: login
        uses: .
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true
      - name: Assert login step ran
        run: |
          echo "outcome: ${{ steps.login.outcome }}"
          if [ "${{ steps.login.outcome }}" = "skipped" ]; then
            echo "FAIL: login step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: login step ran (outcome: ${{ steps.login.outcome }})"
