name: Test scope path traversal is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          registry: ghcr.io
          username: someuser
          password: somepassword
          scope: '../../../etc'
          logout: 'false'
      - name: Assert action failed (config path escapes Buildx config dir)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for path-traversal scope"
            exit 1
          fi
          echo "PASS"
