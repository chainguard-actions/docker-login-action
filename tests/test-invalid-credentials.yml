name: Test invalid credentials against Docker Hub fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          username: actionchain-nonexistent-user-zz9
          password: definitely-not-a-valid-password
          logout: 'false'
      - name: Assert login was rejected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected login with invalid credentials to fail"
            exit 1
          fi
          echo "PASS"
