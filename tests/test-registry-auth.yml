name: Test Docker login with registry-auth input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Login with primary registry
        id: login
        uses: .
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: 'true'
      - name: Assert login succeeded
        run: |
          echo "outcome: ${{ steps.login.outcome }}"
          if [ "${{ steps.login.outcome }}" != "success" ]; then
            echo "FAIL: expected login to succeed but got: ${{ steps.login.outcome }}"
            exit 1
          fi
          echo "PASS: login with registry succeeded"
      - name: Verify docker config was written
        run: |
          if [ ! -f "$HOME/.docker/config.json" ]; then
            echo "FAIL: docker config.json not found after login"
            exit 1
          fi
          echo "PASS: docker config.json exists"
          echo "Docker config keys:"
          cat "$HOME/.docker/config.json" | grep -oE '"(auths|credHelpers|credsStore)"' | sort -u || true
