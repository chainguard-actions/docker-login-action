name: Test basic Docker Hub login
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test Docker Hub login with credentials
        id: action
        uses: .
        with:
          username: testuser
          password: testpassword
          logout: 'true'
        continue-on-error: true
      - name: Assert action ran (login may fail with invalid creds but action should execute)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an auth error (not a crash)
          # We verify the step ran (outcome is set to success or failure, not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action executed with outcome=$OUTCOME"
