name: Test scope input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          registry: registry.example.com
          username: testuser
          password: testpassword
          scope: 'repository:myorg/myimage:pull,push'
          logout: 'false'
      - name: Assert action ran with scope input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail because the registry is not reachable,
          # but it must have processed the scope input (not errored on unknown input).
          # Both success and failure are acceptable; what matters is the scope input
          # was accepted without an "unknown input" error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with scope input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
