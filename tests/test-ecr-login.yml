name: Test ECR login (no real AWS credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt ECR login with fake credentials
        id: login
        uses: .
        with:
          registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
          username: AKIAIOSFODNN7EXAMPLE
          password: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          ecr: 'true'
          logout: 'false'
        continue-on-error: true

      - name: Assert ECR login failed gracefully with fake credentials
        env:
          OUTCOME: ${{ steps.login.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid ECR credentials (expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
