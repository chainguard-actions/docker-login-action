name: Test ECR False Flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: login
        name: Login to ghcr.io with ecr=false
        uses: .
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          ecr: 'false'
          logout: 'false'
      - name: Assert login succeeded with ecr=false
        env:
          OUTCOME: ${{ steps.login.outcome }}
        run: |
          echo "Login outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected login to succeed with ecr=false but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: login succeeded with ecr=false"
      - name: Assert Docker config has ghcr.io entry
        run: |
          CONFIG_FILE="$HOME/.docker/config.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: Docker config file not found"
            exit 1
          fi
          echo "Docker config:"
          cat "$CONFIG_FILE"
          if ! grep -q "ghcr.io" "$CONFIG_FILE"; then
            echo "FAIL: ghcr.io not found in Docker config"
            exit 1
          fi
          echo "PASS: ghcr.io found in Docker config with ecr=false"
